<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilcar - Controle de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.8/supabase.js"></script>
    <style>
        .brutal-border { border: 4px solid #000000; }
        .brutal-shadow { box-shadow: 5px 5px 0px 0px #000000; }
        .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px #000000; }
        .brutal-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px 0px #000000; }
    </style>
</head>
<body class="bg-[#F0F0F0] text-black font-mono min-h-screen p-6">

    <header class="bg-[#FFDE4D] brutal-border brutal-shadow p-6 mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black uppercase tracking-wider">Wilcar Funilaria</h1>
            <p class="text-sm font-bold mt-1 uppercase">Logística &amp; Controle de Peças (Carros Aprovados)</p>
        </div>
        <button type="button" onclick="abrirModal()" class="bg-[#38E54D] text-black font-black uppercase px-6 py-3 brutal-border brutal-shadow-sm brutal-btn text-sm tracking-wider">
            + Nova Demanda de Peça
        </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF6B6B] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">1. Demandas de Peças</h2>
            <div id="col-1" class="space-y-4 min-h-[500px]"></div>
        </div>
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF9F43] text-black font-black uppercase p-2 text-center brutal-border text-sm mb-4">2. Em Trânsito / Montagem</h2>
            <div id="col-2" class="space-y-4 min-h-[500px]"></div>
        </div>
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#1DD1A1] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">3. Pronto / Liberado</h2>
            <div id="col-3" class="space-y-4 min-h-[500px]"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#FFF] brutal-border brutal-shadow w-full max-w-lg p-6 relative">
            <button type="button" onclick="fecharModal()" class="absolute top-4 right-4 font-black text-xl">X</button>
            <h3 id="modal-titulo" class="text-xl font-black uppercase mb-4 bg-[#FFDE4D] p-2 brutal-border inline-block">Nova O.S. Peças</h3>
            
            <form id="form-os" onsubmit="return false;" class="space-y-4">
                <input type="hidden" id="os-id">
                <input type="hidden" id="os-carro-antigo">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Placa do Veículo</label>
                        <input type="text" id="placa" required class="w-full p-2 brutal-border font-bold uppercase text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Modelo / Veículo</label>
                        <input type="text" id="modelo" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Unidade Wilcar</label>
                        <select id="unidade" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="Tatuapé">Tatuapé</option>
                            <option value="Leopoldina">Leopoldina</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Responsável pelas Peças</label>
                        <select id="responsavel" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="Oficina">Oficina (Wilcar)</option>
                            <option value="Movida">Movida</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase mb-1">Lista de Peças Necessárias</label>
                    <textarea id="pecas" rows="4" required placeholder="Ex: Capô, Farol Direito..." class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9] resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-4 pt-2">
                    <button type="button" onclick="fecharModal()" class="bg-[#FF6B6B] text-white font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Cancelar</button>
                    <button type="button" onclick="salvarOS()" class="bg-[#38E54D] text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // COLOQUE SEUS DADOS REAIS AQUI ABAIXO
        const SUPABASE_URL = "https://pboowzhhmcbxlmceiyps.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Pno1N5PLG_Hb8C3BOAIPDw_t7zz-lq4";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase.from('servicos').select('*').order('id', { ascending: true });
                if (error) throw error;

                for (let i = 1; i <= 3; i++) {
                    const col = document.getElementById('col-' + i);
                    if (col) col.innerHTML = '';
                }

                data.forEach(item => {
                    let info = { modelo: item.carro || 'Sem modelo', unidade: 'Tatuapé', responsavel: 'Oficina', pecas: '', etapa: 1 };
                    
                    if (item.carro && item.carro.includes('||')) {
                        let partes = item.carro.split('||');
                        info.modelo = partes[0];
                        info.unidade = partes[1] || 'Tatuapé';
                        info.responsavel = partes[2] || 'Oficina';
                        info.pecas = partes[3] || '';
                        info.etapa = parseInt(partes[4] || '1');
                    }

                    const col = document.getElementById('col-' + info.etapa);
                    if (col) {
                        let botaoVoltar = info.etapa > 1 ? '<button type="button" onclick="mudarEtapa(' + item.id + ', \'' + item.nome + '\', \'' + item.carro + '\', ' + (info.etapa - 1) + ')" class="text-[10px] font-black bg-white px-1 brutal-border brutal-shadow-sm">&lt; Voltar</button>' : '<div></div>';
                        let botaoAvancar = info.etapa < 3 ? '<button type="button" onclick="mudarEtapa(' + item.id + ', \'' + item.nome + '\', \'' + item.carro + '\', ' + (info.etapa + 1) + ')" class="text-[10px] font-black bg-black text-white px-1 brutal-border brutal-shadow-sm">Avançar &gt;</button>' : '<div></div>';

                        let htmlCard = '';
                        htmlCard += '<div class="bg-[#F9F9F9] brutal-border brutal-shadow-sm p-3 relative group">';
                        htmlCard += '  <div class="absolute top-2 right-2 space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">';
                        htmlCard += '    <button type="button" onclick="editarOS(' + item.id + ', \'' + item.nome + '\', \'' + info.modelo + '\', \'' + info.unidade + '\', \'' + info.responsavel + '\', \'' + info.pecas.replace(/\n/g, ' ') + '\')" class="text-xs font-black bg-[#FECA57] px-1.5 py-0.5 brutal-border">E</button>';
                        htmlCard += '    <button type="button" onclick="deletarOS(' + item.id + ')" class="text-xs font-black bg-[#FF6B6B] text-white px-1.5 py-0.5 brutal-border">X</button>';
                        htmlCard += '  </div>';
                        htmlCard += '  <div class="text-xs font-black bg-black text-white px-1.5 py-0.5 inline-block mb-2">' + (item.nome || 'SEM PLACA') + '</div>';
                        htmlCard += '  <h4 class="font-black text-sm uppercase">' + info.modelo + '</h4>';
                        htmlCard += '  <p class="text-xs font-bold mt-1 text-gray-700">📍 Unidade: <span class="underline">' + info.unidade + '</span></p>';
                        htmlCard += '  <p class="text-xs font-bold text-gray-700">📦 Peças por: <span class="bg-[#FFDE4D] px-1">' + info.responsavel + '</span></p>';
                        htmlCard += '  <div class="mt-2 pt-2 border-t border-dashed border-black">';
                        htmlCard += '    <p class="text-[11px] font-bold text-gray-600 uppercase">Peças:</p>';
                        htmlCard += '    <p class="text-xs font-medium whitespace-pre-line bg-white p-1.5 brutal-border mt-0.5">' + info.pecas + '</p>';
                        htmlCard += '  </div>';
                        htmlCard += '  <div class="flex justify-between mt-3 pt-2 border-t border-black">';
                        htmlCard += '    ' + botaoVoltar;
                        htmlCard += '    ' + botaoAvancar;
                        htmlCard += '  </div>';
                        htmlCard += '</div>';

                        col.innerHTML += htmlCard;
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function salvarOS() {
            try {
                const id = document.getElementById('os-id').value;
                const placa = document.getElementById('placa').value;
                const modelo = document.getElementById('modelo').value;
                const unidade = document.getElementById('unidade').value;
                const responsavel = document.getElementById('responsavel').value;
                const pecas = document.getElementById('pecas').value;

                if (!placa || !modelo) {
                    alert("Por favor, preencha a Placa e o Modelo!");
                    return;
                }
                
                let etapaAtual = "1";
                if (id && document.getElementById('os-carro-antigo').value.includes('||')) {
                    let partes = document.getElementById('os-carro-antigo').value.split('||');
                    etapaAtual = partes[4] || "1";
                }

                const stringCompactada = modelo + "||" + unidade + "||" + responsavel + "||" + pecas + "||" + etapaAtual;

                if (id) {
                    // Atualização simples
                    await supabase.from('servicos').update({ nome: placa, carro: stringCompactada }).eq('id', id);
                } else {
                    // MUDANÇA CRUCIAL: Chamando a função RPC para burlar o erro de ID do banco
                    const { error } = await supabase.rpc('inserir_servico_auto', {
                        nome_veiculo: placa,
                        carro_dados: stringCompactada
                    });
                    if (error) throw error;
                }
                fecharModal();
                carregarDados();
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar: " + err.message);
            }
        }

        async function mudarEtapa(id, nomePlaca, carroString, novaEtapa) {
            if (!carroString.includes('||')) return;
            let partes = carroString.split('||');
            const novaString = partes[0] + "||" + partes[1] + "||" + partes[2] + "||" + partes[3] + "||" + novaEtapa;
            
            await supabase.from('servicos').update({ carro: novaString }).eq('id', id);
            carregarDados();
        }

        async function deletarOS(id) {
            if (confirm("Deseja mesmo excluir este registro de peças?")) {
                await supabase.from('servicos').delete().eq('id', id);
                carregarDados();
            }
        }

        function abrirModal() {
            document.getElementById('form-os').reset();
            document.getElementById('os-id').value = '';
            document.getElementById('os-carro-antigo').value = '';
            document.getElementById('modal-titulo').innerText = 'Nova O.S. Peças';
            document.getElementById('modal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editarOS(id, placa, modelo, unidade, responsavel, pecas) {
            abrirModal();
            document.getElementById('modal-titulo').innerText = 'Editar Registro';
            document.getElementById('os-id').value = id;
            document.getElementById('placa').value = placa;
            document.getElementById('modelo').value = modelo;
            document.getElementById('unidade').value = unidade;
            document.getElementById('responsavel').value = responsavel;
            document.getElementById('pecas').value = pecas;
            document.getElementById('os-carro-antigo').value = modelo + "||" + unidade + "||" + responsavel + "||" + pecas;
        }

        window.onload = function() {
            if (supabase) carregarDados();
        };
    </script>
</body>
</html>
