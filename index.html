<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilcar - Controle de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilo Brutalismo */
        .brutal-border {
            border: 4px solid #000000;
        }
        .brutal-shadow {
            box-shadow: 5px 5px 0px 0px #000000;
        }
        .brutal-shadow-sm {
            box-shadow: 3px 3px 0px 0px #000000;
        }
        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px 0px #000000;
        }
    </style>
</head>
<body class="bg-[#F0F0F0] text-black font-mono min-h-screen p-6">

    <header class="bg-[#FFDE4D] brutal-border brutal-shadow p-6 mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black uppercase tracking-wider">Wilcar Funilaria</h1>
            <p class="text-sm font-bold mt-1 uppercase">Logística & Controle de Peças (Carros Aprovados)</p>
        </div>
        <button onclick="abrirModal()" class="bg-[#38E54D] text-black font-black uppercase px-6 py-3 brutal-border brutal-shadow-sm brutal-btn text-sm tracking-wider">
            + Nova Demanda de Peça
        </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF6B6B] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">1. Aguardando Cotação</h2>
            <div id="col-1" class="space-y-4 min-h-[500px]"></div>
        </div>

        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF9F43] text-black font-black uppercase p-2 text-center brutal-border text-sm mb-4">2. Em Trânsito</h2>
            <div id="col-2" class="space-y-4 min-h-[500px]"></div>
        </div>

        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FECA57] text-black font-black uppercase p-2 text-center brutal-border text-sm mb-4">3. Peças na Oficina</h2>
            <div id="col-3" class="space-y-4 min-h-[500px]"></div>
        </div>

        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#48DBFB] text-black font-black uppercase p-2 text-center brutal-border text-sm mb-4">4. Em Montagem</h2>
            <div id="col-4" class="space-y-4 min-h-[500px]"></div>
        </div>

        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#1DD1A1] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">5. Pronto / Liberado</h2>
            <div id="col-5" class="space-y-4 min-h-[500px]"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#FFF] brutal-border brutal-shadow w-full max-w-lg p-6 relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 font-black text-xl">X</button>
            <h3 id="modal-titulo" class="text-xl font-black uppercase mb-4 bg-[#FFDE4D] p-2 brutal-border inline-block">Nova O.S. Peças</h3>
            
            <form id="form-os" onsubmit="salvarOS(event)" class="space-y-4">
                <input type="hidden" id="os-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Placa do Veículo</label>
                        <input type="text" id="placa" required class="w-full p-2 brutal-border font-bold uppercase text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Modelo / Veículo</label>
                        <input type="text" id="modelo" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Unidade Wilcar</label>
                        <select id="unidade" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="Guarulhos">Guarulhos</option>
                            <option value="São Paulo">São Paulo</option>
                            <option value="Outra">Outra Unidade</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Responsável pelas Peças</label>
                        <select id="responsavel" required class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="Oficina">Oficina (Wilcar)</option>
                            <option value="Movida">Movida</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase mb-1">Lista de Peças Necessárias</label>
                    <textarea id="pecas" rows="4" required placeholder="Ex: Capô, Farol Direito, Para-choque dianteiro..." class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9] resize-none"></textarea>
                </div>

                <div class="flex justify-end space-x-4 pt-2">
                    <button type="button" onclick="fecharModal()" class="bg-[#FF6B6B] text-white font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Cancelar</button>
                    <button type="submit" class="bg-[#38E54D] text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO BANCO (Substitua com as suas chaves do Supabase)
        const SUPABASE_URL = "https://pboowzhhmcbxlmceiyps.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Pno1N5PLG_Hb8C3BOAIPDw_t7zz-lq4";
        const supabase = window.@supabase.supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // IMPORTANTE: Mapeamento para não quebrar seu banco antigo
        // placa -> placa
        // modelo -> modelo
        // sinistro -> unidade
        // status -> responsavel
        // detalhes -> pecas
        // etapa -> coluna do kanban (1 a 5)

        async function carregarDados() {
            if (!supabase) return;
            const { data, error } = await supabase.from('os_movida').select('*').order('id', { ascending: true });
            if (error) return console.error(error);

            // Limpa as colunas
            for (let i = 1; i <= 5; i++) document.getElementById(`col-${i}`).innerHTML = '';

            data.forEach(item => {
                const etapa = item.etapa || 1;
                const col = document.getElementById(`col-${etapa}`);
                if (col) {
                    col.innerHTML += `
                        <div class="bg-[#F9F9F9] brutal-border brutal-shadow-sm p-3 relative group">
                            <div class="absolute top-2 right-2 space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="editarOS(${item.id}, '${item.placa}', '${item.modelo}', '${item.sinistro}', '${item.status}', '${item.detalhes}')" class="text-xs font-black bg-[#FECA57] px-1.5 py-0.5 brutal-border">E</button>
                                <button onclick="deletarOS(${item.id})" class="text-xs font-black bg-[#FF6B6B] text-white px-1.5 py-0.5 brutal-border">X</button>
                            </div>
                            <div class="text-xs font-black bg-[#000] text-white px-1.5 py-0.5 inline-block mb-2">${item.placa}</div>
                            <h4 class="font-black text-sm uppercase">${item.modelo}</h4>
                            <p class="text-xs font-bold mt-1 text-gray-700">📍 Unidade: <span class="underline">${item.sinistro || 'Não informada'}</span></p>
                            <p class="text-xs font-bold text-gray-700">📦 Peças por: <span class="bg-[#FFDE4D] px-1">${item.status || 'Oficina'}</span></p>
                            <div class="mt-2 pt-2 border-t border-dashed border-black">
                                <p class="text-[11px] font-bold text-gray-600 uppercase">Peças:</p>
                                <p class="text-xs font-medium whitespace-pre-line bg-white p-1.5 brutal-border mt-0.5">${item.detalhes || ''}</p>
                            </div>
                            
                            <div class="flex justify-between mt-3 pt-2 border-t border-black">
                                ${etapa > 1 ? `<button onclick="mudarEtapa(${item.id}, ${etapa - 1})" class="text-[10px] font-black bg-white px-1 brutal-border brutal-shadow-sm">&lt; Voltar</button>` : '<div></div>'}
                                ${etapa < 5 ? `<button onclick="mudarEtapa(${item.id}, ${etapa + 1})" class="text-[10px] font-black bg-black text-white px-1 brutal-border brutal-shadow-sm">Avançar &gt;</button>` : '<div></div>'}
                            </div>
                        </div>
                    `;
                }
            });
        }

        async function salvarOS(e) {
            e.preventDefault();
            const id = document.getElementById('os-id').value;
            const payload = {
                placa: document.getElementById('placa').value,
                modelo: document.getElementById('modelo').value,
                sinistro: document.getElementById('unidade').value, // Salva unidade no campo sinistro
                status: document.getElementById('responsavel').value, // Salva responsavel no campo status
                detalhes: document.getElementById('pecas').value    // Salva pecas no campo detalhes
            };

            if (id) {
                await supabase.from('os_movida').update(payload).eq('id', id);
            } else {
                payload.etapa = 1;
                await supabase.from('os_movida').insert([payload]);
            }
            fecharModal();
            carregarDados();
        }

        async function mudarEtapa(id, novaEtapa) {
            await supabase.from('os_movida').update({ etapa: novaEtapa }).eq('id', id);
            carregarDados();
        }

        async function deletarOS(id) {
            if (confirm("Deseja mesmo excluir este registro de peças?")) {
                await supabase.from('os_movida').delete().eq('id', id);
                carregarDados();
            }
        }

        function abrirModal() {
            document.getElementById('form-os').reset();
            document.getElementById('os-id').value = '';
            document.getElementById('modal-titulo').innerText = 'Nova O.S. Peças';
            document.getElementById('modal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editarOS(id, placa, modelo, unidade, responsavel, pecas) {
            abrirModal();
            document.getElementById('modal-titulo').innerText = 'Editar Registro';
            document.getElementById('os-id').value = id;
            document.getElementById('placa').value = placa;
            document.getElementById('modelo').value = modelo;
            document.getElementById('unidade').value = unidade !== 'null' ? unidade : 'Guarulhos';
            document.getElementById('responsavel').value = responsavel !== 'null' ? responsavel : 'Oficina';
            document.getElementById('pecas').value = pecas !== 'null' ? pecas : '';
        }

        if (supabase) carregarDados();
    </script>
</body>
</html>
