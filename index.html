<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilcar - Controle de Peças</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca estável do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.js"></script>
    <style>
        /* Estilo Brutalismo */
        .brutal-border { border: 4px solid #000000; }
        .brutal-shadow { box-shadow: 5px 5px 0px 0px #000000; }
        .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px #000000; }
        .brutal-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px 0px #000000; }
    </style>
</head>
<body class="bg-[#F0F0F0] text-black font-mono min-h-screen p-6">

    <!-- Header -->
    <header class="bg-[#FFDE4D] brutal-border brutal-shadow p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-black uppercase tracking-wider">Wilcar Funilaria</h1>
            <p class="text-sm font-bold mt-1 uppercase">Logística &amp; Controle de Peças (Carros Aprovados)</p>
        </div>
        <button type="button" onclick="abrirModal()" class="bg-[#38E54D] text-black font-black uppercase px-6 py-3 brutal-border brutal-shadow-sm brutal-btn text-sm tracking-wider w-full md:w-auto">
            + Nova Demanda de Peça
        </button>
    </header>

    <!-- PAINEL DE FILTROS & BUSCA -->
    <div class="bg-white brutal-border brutal-shadow p-4 mb-8 space-y-4">
        <!-- Linha 1: Filtro de Unidades -->
        <div class="flex flex-col sm:flex-row items-center gap-4 border-b border-dashed border-black pb-3">
            <span class="font-black uppercase text-sm tracking-wider">📍 Filtrar Unidade:</span>
            <div class="flex flex-wrap gap-2">
                <button onclick="filtrarPorUnidade('TODAS')" id="btn-filtro-todas" class="bg-black text-white font-black uppercase px-4 py-2 brutal-border text-xs tracking-wider">💥 Ver Todas</button>
                <button onclick="filtrarPorUnidade('1')" id="btn-filtro-tatuape" class="bg-white text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs tracking-wider">🏢 Tatuapé</button>
                <button onclick="filtrarPorUnidade('2')" id="btn-filtro-leopoldina" class="bg-white text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs tracking-wider">🏭 Leopoldina</button>
            </div>
        </div>
        
        <!-- Linha 2: Busca por Placa/Modelo e Data -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-2">
                <label class="block text-xs font-black uppercase mb-1">🔍 Pesquisar por Placa ou Carro:</label>
                <input type="text" id="busca-texto" oninput="renderizarPainel()" placeholder="Digite a placa (ex: UBT8D93) ou modelo do veículo..." class="w-full p-2 brutal-border font-bold uppercase text-sm focus:outline-none bg-[#F9F9F9]">
            </div>
            <div>
                <label class="block text-xs font-black uppercase mb-1">📅 Filtrar por Data de Entrada:</label>
                <div class="flex gap-2">
                    <input type="date" id="busca-data" onchange="renderizarPainel()" class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                    <button onclick="limparFiltroData()" class="bg-[#FF6B6B] text-white font-black uppercase px-3 brutal-border brutal-shadow-sm brutal-btn text-xs">Limpar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Kanban Board -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Coluna 1: Demandas de Peças -->
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF6B6B] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">1. Demandas de Peças</h2>
            <div id="col-1" class="space-y-4 min-h-[500px]"></div>
        </div>
        <!-- Coluna 2: Comprada / Em Trânsito -->
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#FF9F43] text-black font-black uppercase p-2 text-center brutal-border text-sm mb-4">2. Comprada / Em Trânsito</h2>
            <div id="col-2" class="space-y-4 min-h-[500px]"></div>
        </div>
        <!-- Coluna 3: Peça Recebida -->
        <div class="bg-white brutal-border brutal-shadow p-4">
            <h2 class="bg-[#1DD1A1] text-white font-black uppercase p-2 text-center brutal-border text-sm mb-4">3. Peça Recebida</h2>
            <div id="col-3" class="space-y-4 min-h-[500px]"></div>
        </div>
    </div>

    <!-- Modal de Cadastro / Edição -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#FFF] brutal-border brutal-shadow w-full max-w-lg p-6 relative">
            <button type="button" onclick="fecharModal()" class="absolute top-4 right-4 font-black text-xl">X</button>
            <h3 id="modal-titulo" class="text-xl font-black uppercase mb-4 bg-[#FFDE4D] p-2 brutal-border inline-block">Nova O.S. Peças</h3>
            
            <form id="form-os" onsubmit="return false;" class="space-y-4">
                <input type="hidden" id="os-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Placa do Veículo</label>
                        <input type="text" id="placa" class="w-full p-2 brutal-border font-bold uppercase text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Modelo / Veículo</label>
                        <input type="text" id="modelo" class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Unidade Wilcar</label>
                        <select id="unidade" class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="1">Tatuapé</option>
                            <option value="2">Leopoldina</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase mb-1">Responsável pelas Peças</label>
                        <select id="responsavel" class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                            <option value="Oficina">Oficina (Wilcar)</option>
                            <option value="Movida">Movida</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase mb-1">Data de Abertura</label>
                    <input type="date" id="data_demanda" class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9]">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase mb-1">Lista de Peças Necessárias</label>
                    <textarea id="pecas" rows="4" placeholder="Ex: Capô, Farol Direito..." class="w-full p-2 brutal-border font-bold text-sm focus:outline-none bg-[#F9F9F9] resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-4 pt-2">
                    <button type="button" onclick="fecharModal()" class="bg-[#FF6B6B] text-white font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Cancelar</button>
                    <button type="button" onclick="salvarOS()" class="bg-[#38E54D] text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pboowzhhmcbxlmceiyps.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Pno1N5PLG_Hb8C3BOAIPDw_t7zz-lq4";
        
        let supabaseClient = null;
        let unidadeFiltroAtual = "TODAS";
        let dadosLocais = [];

        function conectarBanco() {
            if (supabaseClient) return supabaseClient;
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                return supabaseClient;
            }
            return null;
        }

        async function carregarDados() {
            const cliente = conectarBanco();
            if (!cliente) return;
            try {
                const { data, error } = await cliente.from('ordens_servico').select('*').order('id', { ascending: true });
                if (error) throw error;
                dadosLocais = data || [];
                renderizarPainel();
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
            }
        }

        function formatarDataBR(dataIso) {
            if (!dataIso || dataIso === 'undefined') return 'N/A';
            let dataLimpa = dataIso.split('T')[0];
            const partes = dataLimpa.split('-');
            if (partes.length !== 3) return dataIso;
            return partes[2] + '/' + partes[1] + '/' + partes[0];
        }

        function limparFiltroData() {
            document.getElementById('busca-data').value = '';
            renderizarPainel();
        }

        function renderizarPainel() {
            for (let i = 1; i <= 3; i++) {
                const col = document.getElementById('col-' + i);
                if (col) col.innerHTML = '';
            }

            const filtroTexto = document.getElementById('busca-texto').value.toLowerCase().trim();
            const filtroData = document.getElementById('busca-data').value;

            dadosLocais.forEach(item => {
                let nomePlaca = item.placa || 'SEM PLACA';
                let dadoCarro = item.modelo || 'SEM MODELO';
                let dataEntradaRaw = item.data_entrada || '';
                let dataEntradaLimpa = dataEntradaRaw.split('T')[0];

                let etapaNum = 1;
                if (item.status_fluxo) {
                    let st = item.status_fluxo.toString();
                    if (st === '1' || st === '2' || st === '3') etapaNum = parseInt(st);
                }

                let nomeUnidade = 'Tatuapé';
                if (item.unidade_id && item.unidade_id.toString() === '2') {
                    nomeUnidade = 'Leopoldina';
                }

                let textoSinistroRaw = item.sinistro || '';
                let responsavelDetectado = 'Oficina';
                let pecasLimpasParaExibir = textoSinistroRaw;

                if (textoSinistroRaw.startsWith('[MOVIDA]')) {
                    responsavelDetectado = 'Movida';
                    pecasLimpasParaExibir = textoSinistroRaw.replace('[MOVIDA]', '').trim();
                } else if (textoSinistroRaw.startsWith('[OFICINA]')) {
                    responsavelDetectado = 'Oficina';
                    pecasLimpasParaExibir = textoSinistroRaw.replace('[OFICINA]', '').trim();
                }

                let info = { 
                    modelo: dadoCarro, 
                    unidade: nomeUnidade, 
                    unidadeIdRaw: item.unidade_id ? item.unidade_id.toString() : '1',
                    responsavel: responsavelDetectado, 
                    pecas: pecasLimpasParaExibir || 'Não informadas', 
                    etapa: etapaNum, 
                    data: dataEntradaLimpa 
                };

                if (unidadeFiltroAtual !== "TODAS" && info.unidadeIdRaw !== unidadeFiltroAtual) return;

                if (filtroTexto !== '') {
                    const matchPlaca = nomePlaca.toLowerCase().includes(filtroTexto);
                    const matchModelo = info.modelo.toLowerCase().includes(filtroTexto);
                    const matchPecas = info.pecas.toLowerCase().includes(filtroTexto);
                    if (!matchPlaca && !matchModelo && !matchPecas) return;
                }

                if (filtroData !== '' && info.data !== filtroData) return;

                const col = document.getElementById('col-' + info.etapa);
                if (col) {
                    let mapModelo = (info.modelo || '').toString().replace(/'/g, "\\'").replace(/"/g, '\\"');
                    let mapPecas = (info.pecas || '').toString().replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ').replace(/\r/g, '');

                    let corCardBg = info.etapa === 3 ? 'bg-[#E8F8F5]' : 'bg-[#F9F9F9]';

                    // HTML AJUSTADO: Destaques limpos apenas com tamanho de texto e negrito (sem molduras ao redor da placa)
                    let htmlCard = `<div class="${corCardBg} brutal-border brutal-shadow-sm p-4 relative group">
                        <div class="absolute top-2 right-2 space-x-1 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                            <button type="button" onclick="editarOS(${item.id}, '${nomePlaca}', '${mapModelo}', '${info.unidadeIdRaw}', '${info.responsavel}', '${mapPecas}', '${info.data}')" class="text-xs font-black bg-[#FECA57] px-1.5 py-0.5 brutal-border">E</button>
                            <button type="button" onclick="deletarOS(${item.id})" class="text-xs font-black bg-[#FF6B6B] text-white px-1.5 py-0.5 brutal-border">X</button>
                        </div>
                        
                        <!-- PLACA: Apenas texto grande e em negrito bruto -->
                        <div class="text-xl font-black text-black uppercase tracking-wide mb-1">
                            ${nomePlaca}
                        </div>
                        
                        <!-- MODELO/VEÍCULO: Texto ampliado, em caixa alta e negrito -->
                        <h4 class="font-black text-2xl uppercase tracking-tight text-black mb-2 border-b-2 border-black pb-1">${info.modelo}</h4>
                        
                        <p class="text-xs font-bold mt-1 text-gray-700">📅 Aberto em: <span class="bg-white px-1 border border-black font-black">${formatarDataBR(info.data)}</span></p>
                        <p class="text-xs font-bold mt-0.5 text-gray-700">📍 Unidade: <span class="underline">${info.unidade}</span></p>
                        <p class="text-xs font-bold mt-0.5 text-gray-700">📦 Peças por: <span class="bg-[#FFDE4D] px-1 border border-black text-[11px] font-black uppercase">${info.responsavel}</span></p>
                        
                        <div class="mt-3 pt-2 border-t border-dashed border-black">
                            <p class="text-[11px] font-bold text-gray-600 uppercase">Lista de Peças:</p>
                            <p class="text-xs font-medium bg-white p-1.5 brutal-border mt-0.5 whitespace-pre-line">${info.pecas}</p>
                        </div>
                        
                        <div class="flex justify-between mt-3 pt-2 border-t border-black">
                            ${info.etapa > 1 ? `<button type="button" onclick="mudarEtapa(${item.id}, ${info.etapa - 1})" class="text-[10px] font-black bg-white px-1 brutal-border brutal-shadow-sm">&lt; Voltar</button>` : '<div></div>'}
                            ${info.etapa < 3 ? `<button type="button" onclick="mudarEtapa(${item.id}, ${info.etapa + 1})" class="text-[10px] font-black bg-black text-white px-1 brutal-border brutal-shadow-sm">Avançar &gt;</button>` : '<div></div>'}
                        </div>
                    </div>`;
                    col.innerHTML += htmlCard;
                }
            });
        }

        function filtrarPorUnidade(unidade) {
            unidadeFiltroAtual = Bradley = unidade;
            const botoes = { 'TODAS': document.getElementById('btn-filtro-todas'), '1': document.getElementById('btn-filtro-tatuape'), '2': document.getElementById('btn-filtro-leopoldina') };
            for (let chave in botoes) {
                if (botoes[chave]) {
                    botoes[chave].className = (chave === unidade) ? "bg-black text-white font-black uppercase px-4 py-2 brutal-border text-xs tracking-wider" : "bg-white text-black font-black uppercase px-4 py-2 brutal-border brutal-shadow-sm brutal-btn text-xs tracking-wider";
                }
            }
            renderizarPainel();
        }

        async function salvarOS() {
            const cliente = conectarBanco();
            if (!cliente) return;
            
            try {
                const idCampo = document.getElementById('os-id') ? document.getElementById('os-id').value : '';
                const idLimpo = idCampo.toString().trim();

                const placa = document.getElementById('placa') ? document.getElementById('placa').value.trim() : '';
                const modelo = document.getElementById('modelo') ? document.getElementById('modelo').value.trim() : '';
                const unidade = document.getElementById('unidade') ? document.getElementById('unidade').value : '1';
                const responsavel = document.getElementById('responsavel') ? document.getElementById('responsavel').value : 'Oficina';
                const dataDemanda = document.getElementById('data_demanda') ? document.getElementById('data_demanda').value : '';
                const pecasText = document.getElementById('pecas') ? document.getElementById('pecas').value.trim() : '';

                if (!placa || !modelo) {
                    alert("Por favor, preencha a Placa e o Modelo do Veículo!");
                    return;
                }

                let etapaAtual = "1";
                if (idLimpo !== '') {
                    const itemAntigo = dadosLocais.find(d => d.id == idLimpo);
                    if (itemAntigo && itemAntigo.status_fluxo) {
                        etapaAtual = itemAntigo.status_fluxo.toString();
                    }
                }

                const tagResponsavel = `[${responsavel.toUpperCase()}] `;
                const textoFinalSinistro = tagResponsavel + pecasText;

                const payload = { 
                    placa: placa, 
                    modelo: modelo,
                    status_fluxo: etapaAtual,
                    unidade_id: parseInt(unidade),
                    data_entrada: dataDemanda || null,
                    sinistro: textoFinalSinistro
                };

                let err = null;
                if (idLimpo !== '') {
                    let { error } = await cliente.from('ordens_servico').update(payload).eq('id', idLimpo);
                    err = error;
                } else {
                    let { error } = await cliente.from('ordens_servico').insert([payload]);
                    err = error;
                }
                
                if (err) {
                    alert("Erro do Supabase: " + err.message);
                    return;
                }
                
                fecharModal();
                await carregarDados();
            } catch (err) {
                console.error("Erro interno ao salvar:", err);
            }
        }

        async function mudarEtapa(id, novaEtapa) {
            const cliente = conectarBanco();
            if (!cliente) return;
            
            const item = dadosLocais.find(d => d.id == id);
            if (!item) return;

            let idUnidadeSeguro = 1; 
            if (item.unidade_id) {
                let uStr = item.unidade_id.toString().trim();
                if (uStr === '2' || uStr === 'Leopoldina') idUnidadeSeguro = 2;
            }

            try {
                const { error } = await cliente.from('ordens_servico').update({ 
                    status_fluxo: novaEtapa.toString(),
                    unidade_id: idUnidadeSeguro
                }).eq('id', id);
                
                if (error) throw error;
                await carregarDados();
            } catch (e) {
                console.error("Erro ao mudar etapa:", e);
                alert("Erro ao mover card: " + e.message);
            }
        }

        async function deletarOS(id) {
            const cliente = conectarBanco();
            if (!cliente) return;
            if (confirm("Deseja mesmo excluir este registro de peças?")) {
                await cliente.from('ordens_servico').delete().eq('id', id);
                await carregarDados();
            }
        }

        function abrirModal() {
            document.getElementById('form-os').reset();
            if (document.getElementById('os-id')) document.getElementById('os-id').value = '';
            document.getElementById('modal-titulo').innerText = 'Nova O.S. Peças';
            if (document.getElementById('data_demanda')) {
                document.getElementById('data_demanda').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modal').classList.add('hidden'); }

        function editarOS(id, placa, modelo, unidadeId, responsavel, pecas, dataSalva) {
            abrirModal();
            document.getElementById('modal-titulo').innerText = 'Editar Registro';
            if (document.getElementById('os-id')) document.getElementById('os-id').value = id;
            if (document.getElementById('placa')) document.getElementById('placa').value = placa;
            if (document.getElementById('modelo')) document.getElementById('modelo').value = modelo;
            if (document.getElementById('unidade')) document.getElementById('unidade').value = unidadeId;
            if (document.getElementById('responsavel')) document.getElementById('responsavel').value = responsavel;
            if (document.getElementById('pecas')) document.getElementById('pecas').value = pecas;
            if (dataSalva && dataSalva !== 'undefined' && document.getElementById('data_demanda')) {
                document.getElementById('data_demanda').value = dataSalva.split('T')[0];
            }
        }

        window.onload = function() { carregarDados(); };
    </script>
</body>
</html>
